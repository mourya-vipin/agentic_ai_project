# Each switch has a setting and the values it may take. Our code reads it with
# harness.runtime.switch("group.name"); run.py --set group.name=value sets it for one arm.
# Every setting here is what the decision table in docs/milestones/M1.md says.
#
# Rules: values list only the paths we have built. Quote "off" and "on". A switch added
# after the first committed run in results/ carries added: YYYY-MM-DD on the switch itself,
# never on its group. Each owner edits only their own group.

# Who picks each next step and ends the run, per use case (Lecture 1, the four gates).
# Owner: Aman Panigrahi.
control:
  standard_grant:      {setting: workflow, values: [workflow], about: "U1, a grant the role policy allows. Fails gate 1: fixed steps once parsed."}
  onboarding:          {setting: workflow, values: [workflow], about: "U2, a new starter from the HR feed. Fails gate 1: the role table fixes the steps."}
  offboarding:         {setting: workflow, values: [workflow], about: "U3, a contract ended or a leaver. Fails gate 1."}
  nonstandard_request: {setting: agent,    values: [agent],    about: "U4, any request that is not one policy-allowed group. Passes all four gates."}
  operator_review:     {setting: agent,    values: [agent],    about: "U5, the operator's questions. Read-only investigation."}
  bulk_change:         {setting: agent,    values: [agent],    about: "U6, the operator's own bulk instructions."}

# Whether a use case on the agent path writes a plan that is validated first (Lecture 2, slides 5, 54).
# Owner: Shruti Tewaney.
plan:
  bulk_change: {setting: "on", values: ["off", "on"], about: "U6 as a planned agent; off runs it on the bounded loop."}
  protected_facts: {setting: "on", values: ["off", "on"], added: 2026-11-17, about: "Pass 2 (experiments/LEDGER.md): on tells U6's planner each contractor's protected groups (planner.build_context: protected_memberships) and to plan their removal proposals from the start, so the checkpoint need not revise the plan. on by Pass 2's verdict: 3 of 3 passed in each arm, every legal hold kept and proposed, no revision, 34% cheaper and 8.4 s faster at the median, though total tokens fell only 10% (the 20% predicted was missed). off, as in the build: the checkpoint finds the legal hold and the reviser adds its proposal."}

# Approval at the plan or per action, one switch per use case with a plan (Lecture 5, slide 18).
# Owner: Shruti Tewaney.
approval:
  bulk_change: {setting: plan, values: [per_action, plan], added: 2026-11-15, about: "U6's gated steps are its notes to managers (manager_note/plan_listed). plan: once every note's recipient and text is filled and checked, after the reversible removals and before the first send, one approval lists them all and they then run unasked; any other gated step, or a changed text, asks again. per_action asks once per note. plan by the test: the plan fixes each gated step's recipient and text, and one review replaces one per manager."}

# One agent or a split (Lecture 6, slides 9, 18 and 46). Owner: Shruti Tewaney.
topology: {setting: single, values: [single], added: 2026-11-17, about: "One agent, by Part 3's gates (decisions/0006-topology.md): every component fails gate 1 or gate 3. The split, U6 as a coordinator with an access role and a comms role split by tool surface, is built and tested on the tag m2-split-final, where topology is single | split, so that a later pass can measure it from there."}

# The critique loop on an outgoing action (Lecture 2, slide 43). Owner: Shruti Tewaney.
critique:
  requester_reply: {setting: external, values: ["off", "external"], about: "reply_draft checked against the sandbox's records before it is written."}

# Usage examples in a tool's definition (Lecture 3, slide 18). Owner: Vipin Mourya.
examples:
  access_grant: {setting: "on", values: ["off", "on"], about: "A typical call, then a contractor's time-boxed grant."}
  policy_check_access: {setting: "on", values: ["off", "on"], added: 2026-10-25, about: "A call with one group ID, then several in one call, with IDs no record holds (SYN-GRP-EXAMPLE-READ); dev-v1's t07 invented six IDs. On in every arm since, it did not stop made-up IDs: the enum of strict.policy_check_access did (Pass 3)."}

# Strict mode on a tool's definition (Lecture 3, slides 20 to 22). Owner: Vipin Mourya.
strict:
  directory_get_employee: {setting: "on", values: ["off", "on"], added: 2026-10-25, about: "A call with an argument it does not take (dev-aman-check) costs a turn; a closed schema prevents it."}
  policy_check_access: {setting: "on", values: ["off", "on"], added: 2026-11-18, about: "Pass 3 (experiments/LEDGER.md): on sends group_ids strict, each item an enum of the catalog's group IDs read when the definitions are built, so the model cannot write an ID from a group's name. on by Pass 3's verdict: 0 made-up group IDs in 33 runs against 23 in 13 (pass3-before, pass3-after), one model call fewer on t08 and t10, -9.7% tokens for the arm. off, as in the build: the model makes up IDs such as SYN-GRP-JIRA-EDIT and the boundary refuses them. An enum cannot say that no group fits: for a request naming none (t07, Maya Chen's), it checked a real, unrelated group."}
  channel_ask_template: {setting: "on", values: ["off", "on"], added: 2026-11-18, about: "Pass 3, with strict.policy_check_access: on sends group_id strict, an enum of the catalog's group IDs, and request_id nullable. on by Pass 3's verdict: t05, t08 and t10 asked about SYN-GRP-GITHUB-ENG at once in 9 of 9 runs, against SYN-GRP-GITHUB-ENGINEERS first in 9 of 9. off, as in the build: the ID is made up from the group's name and the hook refuses it."}

# Notes outside the conversation, untouched by compaction, one switch per kind of session that
# needs them (Lecture 2, slide 28). Replaces the starter's flat notes switch. Owner: Vipin Mourya.
notes:
  console: {setting: "on", values: ["off", "on"], added: 2026-11-13, about: "The operator's day at the console needs them: its longest M1 session ran 42 model calls and 100,617 prompt tokens, many times the budget. A single workflow run does not: its calls are short and far under it. Our code writes them from each write's IDs and status (agent/notes.py); they go in loop, executor and answer calls, never the planner's."}

# How tool definitions reach the model (Lecture 3, slides 23 to 25). Owner: Vipin Mourya.
tools:
  loading: {setting: all, values: [all, deferred], added: 2026-11-13, about: "all sends every definition a use case is offered. deferred sends a use case with more than 10 tools (U4 15, U6 loop 15) its core tools and tools_search, and what the search finds. all by the count: its calls mostly hit the cache (70.1% of the build's prompt tokens), and no pass measured deferred: Pass 3 took the made-up group IDs."}

# The model writes a short program that calls the tools, per use case (Lecture 3, slides 26, 27).
# Owner: Vipin Mourya.
code_calls:
  operator_review: {setting: "off", values: ["off", "on"], added: 2026-11-13, about: "U5 filters today's requests down to a few: the case that comes closest to looping over many results, so on offers code_run (agent/codecalls.py). off until a pass measures it; U4 calls its tools one at a time."}

# The most input tokens one model call may carry, characters / 4, definitions included
# (Lecture 2, slides 23, 24). Owner: Vipin Mourya.
context_budget: {setting: 8000, added: 2026-11-13, about: "Far below gpt-4.1-mini's 1,047,576-token window, with room for the output. The largest single M1 call was 5,830 tokens; and session_token_ceiling (400,000) over 8,000 leaves 50 calls a session, above M1's longest console session (42)."}

# Past this many input tokens, compaction runs: old tool results cleared first, then older turns
# summarized (Lecture 2, slide 31). At most the budget minus what every call carries. Owner: Vipin Mourya.
compaction_threshold: {setting: 4000, added: 2026-11-13, about: "Tokens of conversation, past which compaction runs: the budget (8,000) minus what every call carries, the system prompt and up to about 3,700 tokens of definitions and prompt."}

# Memory across sessions, with provenance (Lecture 4, Section D; agent/memory.py). Owner: Aman Panigrahi.
memory:
  facts: {setting: "on", values: ["off", "on"], added: 2026-11-18, about: "A fact that the operator states about a person or a group that the sandbox does not hold (\"remember that Victor Lam's legal hold stays until Legal says it can go\") is kept with its subject, its source and its age; a newer fact about the same subject supersedes it. on: the sandbox has no field for it, so without the record the operator must say it again. off keeps facts out: none is written, and no read returns one."}
  preferences: {setting: "on", values: ["off", "on"], added: 2026-11-16, about: "What the operator states for later (\"from now on, ...\", \"remember that ...\") is kept with its source and age, and a new session shows it first. on: a preference costs the operator a sentence each session to say again, and a later session acts on it only if it is kept. Who holds which group is never kept: the sandbox holds it, and a copy goes stale."}
