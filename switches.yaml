# Each switch has a setting and the values it may take. Our code reads it with
# harness.runtime.switch("group.name"); run.py --set group.name=value sets it for one arm.
# Every setting here is what the decision table in docs/milestones/M1.md says.
#
# Rules: values list only the paths we have built. Quote "off" and "on". A switch added
# after the first committed run in results/ carries added: YYYY-MM-DD on the switch itself,
# never on its group. Each owner edits only their own group.

# Who picks each next step and ends the run, per use case (Lecture 1, the four gates).
# Owner: Aman Panigrahi.
control:
  standard_grant:      {setting: workflow, values: [workflow], about: "U1, a grant the role policy allows. Fails gate 1: fixed steps once parsed."}
  onboarding:          {setting: workflow, values: [workflow], about: "U2, a new starter from the HR feed. Fails gate 1: the role table fixes the steps."}
  offboarding:         {setting: workflow, values: [workflow], about: "U3, a contract ended or a leaver. Fails gate 1."}
  nonstandard_request: {setting: agent,    values: [agent],    about: "U4, any request that is not one policy-allowed group. Passes all four gates."}
  operator_review:     {setting: agent,    values: [agent],    about: "U5, the operator's questions. Read-only investigation."}
  bulk_change:         {setting: agent,    values: [agent],    about: "U6, the operator's own bulk instructions."}

# Whether a use case on the agent path writes a plan that is validated first (Lecture 2, slides 5, 54).
# Owner: Shruti Tewaney.
plan:
  bulk_change: {setting: "on", values: ["off", "on"], about: "U6 as a planned agent; off runs it on the bounded loop."}

# The critique loop on an outgoing action (Lecture 2, slide 43). Owner: Shruti Tewaney.
critique:
  requester_reply: {setting: external, values: ["off", "external"], about: "reply_draft checked against the sandbox's records before it is written."}

# Usage examples in a tool's definition (Lecture 3, slide 18). Owner: Vipin Mourya.
examples:
  access_grant: {setting: "on", values: ["off", "on"], about: "A typical call, then a contractor's time-boxed grant."}
  policy_check_access: {setting: "on", values: ["off", "on"], added: 2026-10-25, about: "Real group IDs, then several in one call; dev-v1's t07 invented six IDs."}

# Strict mode on a tool's definition (Lecture 3, slides 20 to 22). Owner: Vipin Mourya.
strict:
  directory_get_employee: {setting: "on", values: ["off", "on"], added: 2026-10-25, about: "A call with an argument it does not take (dev-aman-check) costs a turn; a closed schema prevents it."}

notes:
  setting: "off"
  values: ["off", "on"]
  about: Whether the agent keeps notes outside the conversation, untouched by compaction. Stays off until Milestone 2.
