<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Project{% endblock %} · IT Access Desk</title>
<script>
  // The theme, before the page draws: "auto" follows the system; "light" or "dark" is the operator's choice.
  (function () {
    const chosen = localStorage.getItem("theme") || "auto";
    const dark = chosen === "dark" || (chosen === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.dataset.chosen = chosen;
  })();
</script>
<style>
  /* IT Access Desk: a top banner, a menu on the left, and cards with depth. No outside files. */
  :root { --bg: #ffffff; --fg: #141a2e; --muted: #5b6480; --line: #e3e6f0; --soft: #f5f6fb;
          --accent: #4f46e5; --accent-2: #7c3aed; --teal: #14b8a6; --glow: #5eead4;
          --agent: #f3f2ff; --outside: #fff8eb; --error: #dc2626;
          --ok: #059669; --wait: #b45309; --run: #4f46e5; --stop: #dc2626; --chip: #eef0f7;
          --radius: 14px;
          --depth-1: 0 1px 2px rgba(20, 26, 46, .06), 0 4px 12px rgba(20, 26, 46, .06);
          --depth-2: 0 2px 4px rgba(20, 26, 46, .06), 0 12px 32px rgba(20, 26, 46, .10);
          --depth-3: 0 6px 12px rgba(20, 26, 46, .08), 0 24px 60px rgba(79, 70, 229, .18); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--fg); font: 14px/1.55 "Segoe UI", "Inter", system-ui, sans-serif;
         background:
           radial-gradient(900px 500px at 8% -10%, #e0e7ff 0, transparent 60%),
           radial-gradient(700px 500px at 100% 0%, #ccfbf1 0, transparent 55%),
           radial-gradient(800px 600px at 60% 110%, #f3e8ff 0, transparent 60%),
           #f6f7fc;
         background-attachment: fixed; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* The banner */
  .banner { position: sticky; top: 0; z-index: 20; height: 56px; display: flex; align-items: center; gap: 14px;
            padding: 0 16px; color: #fff; background: rgba(15, 18, 38, .88); backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px); }
  .banner::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
                   background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--teal)); }
  .banner .burger { background: none; border: 0; box-shadow: none; color: #fff; font-size: 20px; padding: 4px 8px; }
  .brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 650; font-size: 15px; }
  .brand:hover { text-decoration: none; }
  .brand .mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
                 background: linear-gradient(145deg, #6366f1, #8b5cf6 55%, #14b8a6);
                 box-shadow: 0 4px 14px rgba(99, 102, 241, .5), inset 0 1px 0 rgba(255, 255, 255, .35); }
  .brand .mark svg { width: 26px; height: 26px; }
  .brand small { font-weight: 400; color: #a9b1d6; font-size: 12px; }
  .banner form { margin-left: auto; }
  .banner input[type=search] { width: 280px; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .14);
                               background: rgba(255, 255, 255, .08); color: #fff; font: inherit; }
  .banner input[type=search]::placeholder { color: #9aa3c7; }
  .banner input[type=search]:focus { outline: 2px solid rgba(94, 234, 212, .6); }
  .badge-env { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: linear-gradient(135deg, #fbbf24, #f59e0b);
               color: #2b1a00; font-weight: 700; letter-spacing: .4px; box-shadow: 0 2px 10px rgba(245, 158, 11, .35); }
  .who-am-i { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #d7dcf5; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px;
            font-weight: 700; color: #fff; flex: none; background: linear-gradient(145deg, #64748b, #334155);
            box-shadow: 0 2px 6px rgba(20, 26, 46, .25), inset 0 1px 0 rgba(255, 255, 255, .25); }

  /* The menu on the left */
  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 56px); }
  body.menu-closed .shell { grid-template-columns: 0 minmax(0, 1fr); }
  body.menu-closed nav { visibility: hidden; }
  nav { position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; padding: 14px 10px;
        color: #c9cfee; background: linear-gradient(180deg, #151a3a 0%, #1b1446 60%, #0f2a3a 100%); }
  nav input[type=text] { display: block; width: 100%; margin: 0 0 10px; padding: 8px 12px; border-radius: 10px;
                         border: 1px solid rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .06); color: #fff;
                         font: inherit; font-size: 13px; }
  nav input[type=text]::placeholder { color: #8d95c0; }
  nav .group { padding: 14px 10px 6px; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
               letter-spacing: .9px; color: #7f88b8; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin: 2px 0; border-radius: 10px;
          color: #d4d9f5; transition: background .15s, transform .15s; }
  nav a::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #4b5285; flex: none; }
  nav a:hover { background: rgba(255, 255, 255, .07); text-decoration: none; transform: translateX(2px); }
  nav a.here { color: #fff; font-weight: 600; background: linear-gradient(135deg, rgba(99, 102, 241, .55), rgba(20, 184, 166, .35));
               box-shadow: 0 6px 18px rgba(79, 70, 229, .35), inset 0 1px 0 rgba(255, 255, 255, .15); }
  nav a.here::before { background: var(--glow); box-shadow: 0 0 10px var(--glow); }
  nav .foot { margin-top: 20px; padding: 12px 10px; font-size: 11px; color: #7f88b8; border-top: 1px solid rgba(255, 255, 255, .08); }

  /* The work area */
  main { padding: 20px 24px 32px; min-width: 0; }
  main > * { max-width: 1240px; }
  main.wide > * { max-width: none; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 16px; padding: 14px 18px; background: rgba(255, 255, 255, .8);
       border: 1px solid rgba(255, 255, 255, .9); border-radius: var(--radius); box-shadow: var(--depth-1);
       backdrop-filter: blur(8px); letter-spacing: -.2px; }
  h1 .muted { font-weight: 400; }
  h2 { font-size: 13px; font-weight: 700; margin: 22px 0 0; padding: 10px 14px; text-transform: uppercase; letter-spacing: .6px;
       color: #3b3f6b; background: linear-gradient(180deg, #ffffff, #f4f5fd); border: 1px solid var(--line); border-bottom: 0;
       border-radius: var(--radius) var(--radius) 0 0; }
  h2 + * { margin-top: 0; }
  h2 + p, h2 + form, h2 + .line { background: var(--bg); border: 1px solid var(--line); padding: 12px 14px;
                                  margin-top: 0; margin-bottom: 0; border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--depth-1); }
  main > p, section > p { margin: 8px 0; }

  /* Lists */
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; background: var(--bg);
          border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--depth-1); }
  h2 + table, h2 + .scroll table { border-radius: 0 0 var(--radius) var(--radius); }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid #eef0f6; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { background: #f7f8fd; color: #5b6480; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
       white-space: nowrap; }
  tr:hover td { background: #f5f4ff; }
  .scroll { overflow-x: auto; }

  /* Forms and buttons, raised */
  textarea, input[type=text], select { width: 100%; padding: 9px 12px; font: inherit; color: var(--fg); background: var(--bg);
                                      border: 1px solid #d6daea; border-radius: 10px; box-shadow: inset 0 1px 2px rgba(20, 26, 46, .05); }
  select { width: auto; max-width: 100%; }
  textarea:focus, input:focus, select:focus { outline: 3px solid rgba(99, 102, 241, .25); border-color: var(--accent); }
  button { padding: 7px 16px; font: inherit; font-size: 13px; font-weight: 600; border-radius: 10px; border: 1px solid #d6daea;
           background: linear-gradient(180deg, #ffffff, #f2f3fa); color: var(--fg); cursor: pointer;
           box-shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 2px 0 #d9dcec, 0 4px 10px rgba(20, 26, 46, .06);
           transition: transform .08s, box-shadow .08s, filter .15s; }
  button:hover { filter: brightness(1.02); transform: translateY(-1px); }
  button:active { transform: translateY(1px); box-shadow: 0 1px 0 #d9dcec, 0 1px 3px rgba(20, 26, 46, .08); }
  button.primary, button[value=approve] { color: #fff; border-color: transparent;
           background: linear-gradient(135deg, #6366f1, #7c3aed);
           box-shadow: 0 1px 0 rgba(255, 255, 255, .25) inset, 0 3px 0 #4338ca, 0 8px 20px rgba(99, 102, 241, .35); }
  button.primary:active, button[value=approve]:active { box-shadow: 0 1px 0 #4338ca, 0 2px 6px rgba(99, 102, 241, .3); }
  button[value=deny], button.danger { color: var(--stop); }
  button.block { width: 100%; }
  button.small { padding: 3px 11px; font-size: 12px; border-radius: 8px; }
  button.link { border: 0; background: none; box-shadow: none; padding: 0 4px; color: var(--accent); font-size: 12px; font-weight: 500; }
  button.link:hover { transform: none; text-decoration: underline; }
  button.icon { padding: 5px 10px; }
  form { margin: 0; }

  /* Common pieces */
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .warn { color: var(--wait); }
  .notice { padding: 12px 14px; background: linear-gradient(135deg, #eef2ff, #f0fdfa); border: 1px solid #c7d2fe;
            border-radius: var(--radius); margin: 12px 0; box-shadow: var(--depth-1); }
  .error { color: var(--error); }
  code, pre { font-family: "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12px; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); padding: 12px; overflow-x: auto; margin-top: 0; }
  .line { padding: 10px 14px; margin: 10px 0; border-radius: var(--radius); background: var(--bg); border: 1px solid var(--line);
          white-space: pre-wrap; box-shadow: var(--depth-1); }
  .line.reply { background: var(--agent); }
  .line.outside { background: var(--outside); }
  .line.error { border-left: 4px solid var(--error); }
  .who { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); gap: 20px; }
  .split > section:first-child { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
                                 padding: 6px 14px; align-self: start; box-shadow: var(--depth-1); }
  @media (max-width: 760px) { .split { grid-template-columns: minmax(0, 1fr); } }
  .chip { display: inline-block; padding: 0 9px; border-radius: 999px; font-size: 11px; line-height: 20px; font-weight: 650;
          background: var(--chip); color: #4b5372; white-space: nowrap; }
  .chip.running { background: #e0e7ff; color: var(--run); }
  .chip.waiting, .chip.waiting_reply, .chip.waiting_approval, .chip.held { background: #fef3c7; color: var(--wait); }
  .chip.stopped, .chip.failed { background: #fee2e2; color: var(--stop); }
  .chip.done { background: #d1fae5; color: var(--ok); }
  .chip.cancelled { background: #eceef4; color: #6b7280; }
  .spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid #d6daea; border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Cards with depth: .tilt leans toward the pointer (the script below) */
  .box { background: rgba(255, 255, 255, .86); border: 1px solid rgba(255, 255, 255, .95); border-radius: var(--radius);
         box-shadow: var(--depth-2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); overflow: hidden; }
  .box-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 14px;
              border-bottom: 1px solid var(--line); font-weight: 700; font-size: 12px; text-transform: uppercase;
              letter-spacing: .6px; color: #3b3f6b; background: linear-gradient(180deg, rgba(255, 255, 255, .9), rgba(244, 245, 253, .9)); }
  .box-body { padding: 12px 14px; }
  .tilt { transform-style: preserve-3d; transition: transform .25s ease, box-shadow .25s ease; will-change: transform; }
  .tilt:hover { box-shadow: var(--depth-3); }

  /* The console */
  .console { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 18px; align-items: start; }
  .console.open { grid-template-columns: 236px minmax(0, 1fr) 320px; }
  @media (max-width: 1280px) { .console.open { grid-template-columns: 210px minmax(0, 1fr); } .console .panel { grid-column: 1 / -1; } }
  @media (max-width: 760px) { .console, .console.open { grid-template-columns: minmax(0, 1fr); } }
  .sessions { max-height: calc(100vh - 110px); overflow-y: auto; }
  .session { display: flex; flex-direction: column; margin: 6px 8px; padding: 9px 12px; color: var(--fg); border-radius: 10px;
             border: 1px solid transparent; transition: background .15s, transform .15s; }
  .session:hover { background: #f5f4ff; text-decoration: none; transform: translateX(2px); }
  .session.here { background: linear-gradient(135deg, #eef2ff, #f0fdfa); border-color: #c7d2fe; box-shadow: var(--depth-1); }
  .session-id { font-family: "Cascadia Code", Consolas, monospace; font-size: 12px; color: var(--accent); }
  .session .first { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 18px; padding: 14px 18px;
          margin-bottom: 14px; position: relative; }
  .hero .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 700; }
  .hero .title { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  .hero .right { display: flex; gap: 8px; align-items: center; align-self: start; }
  .bubble { position: relative; margin-top: 8px; padding: 10px 14px; border-radius: 14px; max-width: 640px; min-height: 42px;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff); border: 1px solid #dcdcfb; color: #23264d;
            box-shadow: 0 6px 18px rgba(99, 102, 241, .12); white-space: pre-wrap; max-height: 120px; overflow-y: auto; }
  .bubble::before { content: ""; position: absolute; left: -8px; top: 16px; width: 14px; height: 14px; transform: rotate(45deg);
                    background: #eef2ff; border-left: 1px solid #dcdcfb; border-bottom: 1px solid #dcdcfb; }
  .bubble .caret { display: inline-block; width: 7px; height: 14px; margin-left: 2px; background: var(--accent);
                   vertical-align: -2px; animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .dots span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--accent);
               animation: dot 1.2s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-5px); opacity: 1; } }

  .fields { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .stat { padding: 12px 14px; }
  .stat label { display: block; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 700; }
  .stat .n { font-size: 22px; font-weight: 750; letter-spacing: -.5px;
             background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat.warm .n { background: linear-gradient(135deg, #f59e0b, #b45309); -webkit-background-clip: text; background-clip: text; }

  .compose { padding: 12px 14px; border-top: 1px solid var(--line); background: rgba(250, 250, 255, .7); }
  .send-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; }
  .hints { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  button.quick { padding: 3px 11px; font-size: 12px; font-weight: 600; border-radius: 999px; color: var(--accent);
                 background: var(--chip); border: 1px solid transparent; box-shadow: none; }
  button.quick:hover { border-color: var(--accent); background: var(--bg); transform: translateY(-1px); }
  [data-theme="dark"] button.quick { background: #232850; border-color: #343b68; color: #c7cbff; box-shadow: none; }
  [data-theme="dark"] button.quick:hover { border-color: var(--accent); background: #2b3160; }
  .history { height: calc(100vh - 630px); min-height: 240px; overflow-y: auto; padding: 8px 14px; }
  .entry { display: flex; gap: 10px; margin: 12px 0; animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .entry .avatar.operator { background: linear-gradient(145deg, #64748b, #334155); }
  .entry .avatar.agent { background: linear-gradient(145deg, #6366f1, #7c3aed 60%, #14b8a6); }
  .entry .avatar.agent svg { width: 24px; height: 24px; }
  .entry .avatar.outside { background: linear-gradient(145deg, #f59e0b, #b45309); }
  .entry .avatar.system { background: linear-gradient(145deg, #10b981, #047857); }
  .entry .avatar.error { background: linear-gradient(145deg, #f87171, #b91c1c); }
  .entry .card-body { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; background: var(--bg);
                      box-shadow: var(--depth-1); }
  .entry.operator { flex-direction: row-reverse; }
  .entry.operator .card-body { border-radius: 14px 4px 14px 14px; background: linear-gradient(135deg, #f8fafc, #eef2f7); }
  .entry .card-body .who { padding: 7px 12px 0; }
  .entry .card-body .who b { color: var(--fg); font-weight: 650; }
  .entry .text { padding: 4px 12px 10px; white-space: pre-wrap; }
  .entry.agent .card-body { background: linear-gradient(135deg, #ffffff, #f5f4ff); border-color: #e2e0fb; }
  .entry.outside .card-body { background: #fffaf0; border-color: #fde7c2; }
  .entry.error .card-body { border-color: #fecaca; }
  .entry.progress { margin: 4px 0 4px 40px; font-size: 12px; color: var(--muted); }
  .done-list { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 12px 10px; }
  .wait-line { padding: 0 12px 10px; }
  .at { font-variant-numeric: tabular-nums; }
  .panel { max-height: calc(100vh - 110px); overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 2px; }
  .count { display: inline-block; min-width: 20px; padding: 0 7px; border-radius: 999px; background: #e0e7ff;
           color: var(--accent); font-size: 11px; text-align: center; letter-spacing: 0; }
  .card { margin: 8px; padding: 10px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line);
          border-left: 4px solid #cbd0e3; box-shadow: var(--depth-1); }
  .card.run.running { border-left-color: var(--run); }
  .card.run.waiting_reply, .card.run.waiting_approval, .card.run.held { border-left-color: #f59e0b; }
  .card.run.stopped, .card.run.failed { border-left-color: var(--stop); }
  .card.run.done { border-left-color: var(--ok); }
  .card.memory { border-left-color: var(--teal); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .task { margin: 4px 0; white-space: pre-wrap; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .empty { padding: 12px 14px; }

  /* The robot: a head in 3D that floats, blinks, follows the pointer, and talks */
  .robot { width: 112px; height: 112px; perspective: 600px; position: relative; flex: none; }
  .robot .float { width: 100%; height: 100%; animation: float 4s ease-in-out infinite; }
  .robot .head { width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .2s ease-out; }
  .robot svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 14px 16px rgba(79, 70, 229, .28)); }
  .robot .shadow { position: absolute; left: 22%; right: 22%; bottom: -6px; height: 10px; border-radius: 50%;
                   background: radial-gradient(closest-side, rgba(20, 26, 46, .28), transparent); animation: shadow 4s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.8); opacity: .55; } }
  .robot .eyes { transition: transform .15s ease-out; }
  .robot .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .robot .mouth { transform-box: fill-box; transform-origin: center; transition: transform .2s; }
  .robot.talking .mouth { animation: talk .22s ease-in-out infinite alternate; }
  @keyframes talk { from { transform: scaleY(1) scaleX(1); } to { transform: scaleY(3.2) scaleX(.8); } }
  .robot .bulb { transition: fill .3s; }
  .robot .bulb-glow { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(1); } 50% { opacity: .7; transform: scale(1.5); } }
  .robot.thinking .bulb { fill: #a78bfa; } .robot.thinking .bulb-glow { fill: #a78bfa; animation-duration: .7s; }
  .robot.thinking .eyes { transform: translate(3px, -4px) !important; }
  .robot.waiting .bulb { fill: #fbbf24; } .robot.waiting .bulb-glow { fill: #fbbf24; }
  .robot.alert .eye, .robot.alert .mouth { fill: #f87171; } .robot.alert .bulb { fill: #f87171; } .robot.alert .bulb-glow { fill: #f87171; }
  .robot.happy .mouth { transform: scaleX(1.4); }
  .robot-tools { display: flex; gap: 6px; align-items: center; }


  /* Dark mode: the same pieces, with dark surfaces and glows ([data-theme="dark"] on <html>) */
  [data-theme="dark"] { color-scheme: dark;
    --bg: #161a2e; --fg: #e6e9f8; --muted: #9aa3c7; --line: #2a3050; --soft: #1c2140;
    --accent: #8b93ff; --accent-2: #b18cff; --agent: #1d2045; --outside: #2e2616; --error: #f87171;
    --ok: #34d399; --wait: #fbbf24; --run: #8b93ff; --stop: #f87171; --chip: #252b4d;
    --depth-1: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 14px rgba(0, 0, 0, .30);
    --depth-2: 0 2px 4px rgba(0, 0, 0, .40), 0 14px 36px rgba(0, 0, 0, .45);
    --depth-3: 0 6px 14px rgba(0, 0, 0, .45), 0 24px 60px rgba(99, 102, 241, .35); }
  [data-theme="dark"] body {
    background:
      radial-gradient(900px 500px at 8% -10%, rgba(79, 70, 229, .28) 0, transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(20, 184, 166, .18) 0, transparent 55%),
      radial-gradient(800px 600px at 60% 110%, rgba(168, 85, 247, .20) 0, transparent 60%),
      #0b0e1f;
    background-attachment: fixed; }
  [data-theme="dark"] nav { background: linear-gradient(180deg, #0f1330 0%, #140f36 60%, #0a1f2c 100%);
                            border-right: 1px solid rgba(255, 255, 255, .05); }
  [data-theme="dark"] h1 { background: rgba(22, 26, 46, .75); border-color: rgba(255, 255, 255, .06); }
  [data-theme="dark"] h2 { color: #c3c9f0; background: linear-gradient(180deg, #1c2140, #171b34); border-color: var(--line); }
  [data-theme="dark"] th { background: #1b2040; color: #a9b1d6; }
  [data-theme="dark"] th, [data-theme="dark"] td { border-bottom-color: #242a49; }
  [data-theme="dark"] tr:hover td { background: #20254a; }
  [data-theme="dark"] textarea, [data-theme="dark"] input[type=text], [data-theme="dark"] select {
    background: #11152b; border-color: #2f3660; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .4); }
  [data-theme="dark"] textarea:focus, [data-theme="dark"] input:focus, [data-theme="dark"] select:focus {
    outline-color: rgba(139, 147, 255, .35); border-color: var(--accent); }
  [data-theme="dark"] button { background: linear-gradient(180deg, #252b4f, #1c2142); border-color: #343b68; color: var(--fg);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 2px 0 #0d1024, 0 4px 12px rgba(0, 0, 0, .35); }
  [data-theme="dark"] button:active { box-shadow: 0 1px 0 #0d1024, 0 1px 3px rgba(0, 0, 0, .4); }
  [data-theme="dark"] button.primary, [data-theme="dark"] button[value=approve] { color: #fff; border-color: transparent;
    background: linear-gradient(135deg, #6366f1, #7c3aed);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .2) inset, 0 3px 0 #312e81, 0 8px 24px rgba(99, 102, 241, .45); }
  [data-theme="dark"] button[value=deny], [data-theme="dark"] button.danger { color: var(--stop); }
  [data-theme="dark"] button.link { background: none; box-shadow: none; color: var(--accent); }
  [data-theme="dark"] .notice { background: linear-gradient(135deg, #1d2148, #10272c); border-color: #343b78; }
  [data-theme="dark"] .line { border-color: var(--line); }
  [data-theme="dark"] .chip { color: #b9c0e6; }
  [data-theme="dark"] .chip.running { background: rgba(99, 102, 241, .22); color: #aab0ff; }
  [data-theme="dark"] .chip.waiting, [data-theme="dark"] .chip.waiting_reply, [data-theme="dark"] .chip.waiting_approval,
  [data-theme="dark"] .chip.held { background: rgba(245, 158, 11, .18); color: #fcd34d; }
  [data-theme="dark"] .chip.stopped, [data-theme="dark"] .chip.failed { background: rgba(248, 113, 113, .18); color: #fca5a5; }
  [data-theme="dark"] .chip.done { background: rgba(16, 185, 129, .18); color: #6ee7b7; }
  [data-theme="dark"] .chip.cancelled { background: #23284a; color: #9aa3c7; }
  [data-theme="dark"] .box { background: rgba(22, 26, 46, .78); border-color: rgba(255, 255, 255, .06); }
  [data-theme="dark"] .box-head { color: #c3c9f0; background: linear-gradient(180deg, rgba(30, 35, 66, .9), rgba(23, 27, 52, .9)); }
  [data-theme="dark"] .session:hover { background: #1f2448; }
  [data-theme="dark"] .session.here { background: linear-gradient(135deg, #222867, #12303a); border-color: #3a42889e; }
  [data-theme="dark"] .bubble { background: linear-gradient(135deg, #1f2352, #23194a); border-color: #3a3f7e; color: #e6e9f8;
                                box-shadow: 0 6px 22px rgba(99, 102, 241, .25); }
  [data-theme="dark"] .bubble::before { background: #1f2352; border-color: #3a3f7e; }
  [data-theme="dark"] .stat .n { background: linear-gradient(135deg, #a5b4fc, #c4b5fd); -webkit-background-clip: text; background-clip: text; }
  [data-theme="dark"] .stat.warm .n { background: linear-gradient(135deg, #fcd34d, #f59e0b); -webkit-background-clip: text; background-clip: text; }
  [data-theme="dark"] .compose { background: rgba(16, 19, 38, .7); }
  [data-theme="dark"] .entry .card-body { background: #181c36; border-color: var(--line); }
  [data-theme="dark"] .entry.operator .card-body { background: linear-gradient(135deg, #20253f, #1a1f38); }
  [data-theme="dark"] .entry.agent .card-body { background: linear-gradient(135deg, #1b1f44, #201a46); border-color: #33386e; }
  [data-theme="dark"] .entry.outside .card-body { background: #2a2416; border-color: #5a4720; }
  [data-theme="dark"] .entry.error .card-body { border-color: #7f1d1d; }
  [data-theme="dark"] .count { background: rgba(99, 102, 241, .25); color: #c7cbff; }
  [data-theme="dark"] .card { background: #181c36; border-color: var(--line); }
  [data-theme="dark"] .card.memory { border-left-color: var(--teal); }
  [data-theme="dark"] .robot svg { filter: drop-shadow(0 14px 22px rgba(139, 147, 255, .45)); }
  [data-theme="dark"] .robot .shadow { background: radial-gradient(closest-side, rgba(139, 147, 255, .35), transparent); }
  .theme-toggle { min-width: 112px; color: #e6e9f8 !important; background: rgba(255, 255, 255, .08) !important;
                  border: 1px solid rgba(255, 255, 255, .16) !important; box-shadow: none !important; border-radius: 999px !important; }
  .theme-toggle:hover { background: rgba(255, 255, 255, .14) !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <symbol id="bot-mini" viewBox="0 0 40 40">
    <line x1="20" y1="5" x2="20" y2="10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="5" r="2.6" fill="#5eead4"/>
    <rect x="6" y="10" width="28" height="23" rx="9" fill="#fff"/>
    <rect x="10" y="14" width="20" height="14" rx="6" fill="#1e1b4b"/>
    <ellipse cx="16" cy="20.5" rx="2.2" ry="2.6" fill="#5eead4"/>
    <ellipse cx="24" cy="20.5" rx="2.2" ry="2.6" fill="#5eead4"/>
    <rect x="17.5" y="24.5" width="5" height="1.6" rx=".8" fill="#5eead4"/>
  </symbol>
</svg>
<header class="banner">
  <button class="burger" type="button" id="menu-toggle" title="Show or hide the menu" aria-label="Show or hide the menu">&#9776;</button>
  <a class="brand" href="/"><span class="mark"><svg><use href="#bot-mini"/></svg></span><span>IT Access Desk <small>Operator workspace</small></span></a>
  <form method="get" action="/people" role="search">
    <input type="search" name="q" placeholder="Search people: name, email or ID" aria-label="Search people">
  </form>
  <button type="button" class="theme-toggle small" id="theme-toggle" title="The theme: auto (as the system), light or dark">Auto</button>
  <span class="badge-env" title="Every record is synthetic">SANDBOX</span>
  <span class="who-am-i"><span class="avatar">OP</span>Operator</span>
</header>
<div class="shell">
<nav>
  {% set path = request.url.path if request else '' %}
  <input type="text" id="menu-filter" placeholder="Filter the menu" aria-label="Filter the menu">
  <div class="group">Access desk</div>
  <a href="/" class="{{ 'here' if path == '/' or path.startswith('/requests') }}">Requests</a>
  <a href="/people" class="{{ 'here' if path.startswith('/people') }}">People</a>
  <a href="/pending" class="{{ 'here' if path.startswith('/pending') }}">Pending</a>
  <div class="group">Agent</div>
  <a href="/console" class="{{ 'here' if page == 'console' }}">Console</a>
  <a href="/approvals" class="{{ 'here' if page == 'approvals' }}">Approvals</a>
  <a href="/queue" class="{{ 'here' if page == 'queue' }}">Queue</a>
  <a href="/threads" class="{{ 'here' if page == 'threads' }}">Threads</a>
  <div class="group">Diagnostics</div>
  <a href="/traces" class="{{ 'here' if page in ('traces', 'trace') }}">Traces</a>
  <div class="foot">Every record here is synthetic.</div>
</nav>
<main class="{% block wide %}{% endblock %}">
{% block content %}{% endblock %}
</main>
</div>
<script>
  (function () {
    // The menu: a filter, and a button that hides it (kept for the next page).
    const body = document.body;
    if (localStorage.getItem("menu-closed") === "1") body.classList.add("menu-closed");
    document.getElementById("menu-toggle").addEventListener("click", () => {
      body.classList.toggle("menu-closed");
      localStorage.setItem("menu-closed", body.classList.contains("menu-closed") ? "1" : "0");
    });
    const filter = document.getElementById("menu-filter");
    filter.addEventListener("input", () => {
      const q = filter.value.trim().toLowerCase();
      document.querySelectorAll("nav a").forEach((a) => {
        a.style.display = !q || a.textContent.toLowerCase().includes(q) ? "" : "none";
      });
      document.querySelectorAll("nav .group").forEach((g) => { g.style.display = q ? "none" : ""; });
    });

    // The theme button: auto, light, dark, in turn. Auto follows the system as it changes.
    const root = document.documentElement, themeButton = document.getElementById("theme-toggle");
    const names = {auto: "Theme: Auto", light: "Theme: Light", dark: "Theme: Dark"};
    const system = window.matchMedia("(prefers-color-scheme: dark)");
    function apply(chosen) {
      root.dataset.chosen = chosen;
      root.dataset.theme = chosen === "dark" || (chosen === "auto" && system.matches) ? "dark" : "light";
      themeButton.textContent = names[chosen];
    }
    apply(root.dataset.chosen || "auto");
    themeButton.addEventListener("click", () => {
      const next = {auto: "light", light: "dark", dark: "auto"}[root.dataset.chosen || "auto"];
      localStorage.setItem("theme", next);
      apply(next);
    });
    system.addEventListener("change", () => { if ((root.dataset.chosen || "auto") === "auto") apply("auto"); });

    // Cards that lean toward the pointer (.tilt). It works on cards added later too.
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let last = null;
    document.addEventListener("mousemove", (event) => {
      const card = event.target.closest && event.target.closest(".tilt");
      if (last && last !== card) { last.style.transform = ""; }
      last = card;
      if (!card) return;
      const r = card.getBoundingClientRect();
      const x = (event.clientX - r.left) / r.width - 0.5, y = (event.clientY - r.top) / r.height - 0.5;
      const deg = Math.min(6, 900 / Math.max(r.width, 1));
      card.style.transform = `perspective(900px) rotateX(${(-y * deg).toFixed(2)}deg) rotateY(${(x * deg).toFixed(2)}deg) translateZ(4px)`;
    });
    document.addEventListener("mouseleave", () => { if (last) last.style.transform = ""; });
  })();
</script>
</body>
</html>
