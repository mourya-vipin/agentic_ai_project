id: s01_operator_day
title: "The operator's day at the console: a rule stated early, five requests, then questions"
# The long session (Part 1, task 6). Owner: Vipin Mourya.
# The operator states one rule first (no Jira editors today), asks for a summary of the day's
# requests (a read that carries every request's long thread), works through four (Leo's long thread
# and Priya's groups carry SYN-REQ-0004's run past its room, so compaction runs there), then
# hands over a fifth, late, that the rule decides: Felix asks for Jira editors, which his role allows,
# so only the early rule says no. Then four questions about the day, each naming this session's
# records and its answer format. The check (checks/s01_operator_day.py) reads the late action and the
# truth from the sandbox, and the answers from the replies.
inputs:
  - kind: request
    thread: SYN-MSG-S01
    from: maya.chen@syn-corp.example
    text: |-
      SYNTHETIC. Hi IT, I'm starting on the quarterly revenue analysis with Grace's team next week and
      I need to read the Finance Reports dashboards: the monthly close pack, the regional revenue
      breakdown and the cost-centre summaries. I only need to read them, not edit anything. I have
      looked through the request page and I think the group is called Finance Reports readers, but
      please correct me if there is a better one. Our team usually asks for this at the start of each
      quarter, and Leo had it last quarter for the same work. Thanks a lot, Maya
      (Maya Chen, Data Analyst, Data team. Sent from the help desk form.)

      Some background, in case it helps whoever picks this up. The analysis runs for six weeks. In the
      first two I reconcile the regional revenue figures in the dashboards against the warehouse
      extracts we already have, region by region, starting with the Nordics and then the UK and
      Ireland. In weeks three and four I build the variance tables for the cost centres, and in the
      last two weeks I write up the findings for the quarterly business review. Nothing I do changes
      a dashboard: I export the views to our team's workbook and work from there. I won't share the
      exports outside the Data team, and the workbook lives in our team's shared folder, which already
      has the right permissions.

      I tried to open the close pack this morning and got the "You do not have access to this report"
      page, which is how I realised I still need the group. I've attached nothing, as the form says not
      to attach screenshots of finance data.

      > On Tue, the help desk wrote:
      > Thank you for contacting the IT access desk. Your message has been received and a member of the
      > team will look at it during working hours (09:00 to 17:30, Monday to Friday). Please do not
      > reply to this automatic message with new requests; use the request form so that each request
      > gets its own number. For password resets, use the self-service page.

      Maya Chen | Data Analyst | Data team | Syn Corp
      Office: 3rd floor, desk 3.14 | Working hours: Monday to Thursday
