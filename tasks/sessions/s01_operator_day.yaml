id: s01_operator_day
title: "The operator's day at the console: a rule stated early, five requests, then questions"
# The long session (Part 1, task 6). Owner: Vipin Mourya.
# The operator states one rule first (no Jira editors today), works through four requests, then
# hands over a fifth, late, that the rule decides: Felix asks for Jira editors, which his role allows,
# so only the early rule says no. Then four questions about the day, each naming this session's
# records and its answer format. The check (checks/s01_operator_day.py) reads the late action and the
# truth from the sandbox, and the answers from the replies.
inputs:
  - kind: request
    thread: SYN-MSG-S01
    from: maya.chen@syn-corp.example
    text: >-
      SYNTHETIC. Hi IT, I'm starting on the quarterly revenue analysis with Grace's team next week and
      I need to read the Finance Reports dashboards: the monthly close pack, the regional revenue
      breakdown and the cost-centre summaries. I only need to read them, not edit anything. I have
      looked through the request page and I think the group is called Finance Reports readers, but
      please correct me if there is a better one. Our team usually asks for this at the start of each
      quarter, and Leo had it last quarter for the same work. Thanks a lot, Maya
      (Maya Chen, Data Analyst, Data team. Sent from the help desk form.)
  - kind: request
    thread: SYN-MSG-S02
    from: omar.haddad@syn-corp.example
    text: >-
      SYNTHETIC. Hello, could I please get read access to the data warehouse? Callum asked me to pull
      the pipeline numbers for the regional sales review on Thursday, and the saved queries the team
      shares are in the warehouse, so I can't run them without it. Read access is all I need: I won't
      be loading or changing any tables. If this needs my manager's OK, Callum Baird is happy to
      confirm. Many thanks, Omar (Omar Haddad, Account Executive, Sales)
  - kind: request
    thread: SYN-HR-S03
    from: hr-system@syn-corp.example
    text: "SYNTHETIC. EVENT: contract_ended; EMPLOYEE: SYN-EMP-0163; END: 2026-10-19"
  - kind: request
    thread: SYN-MSG-S04
    from: leo.martins@syn-corp.example
    text: >-
      SYNTHETIC. Hi IT, Priya Nair is on leave for three weeks from today and I'm covering her
      month-end reports while she is away: the close pack, the payroll reconciliation and the finance
      reporting dashboards she maintains. Grace said I should ask you for the same access Priya has so
      that nothing stalls at month end. I don't know exactly which groups those are, sorry. Could you
      give me the same access she has, or whatever is closest? Thanks, Leo
      (Leo Martins, Data Analyst, reporting to Grace Okafor)
  - kind: request
    thread: SYN-MSG-S05
    from: felix.wagner@syn-corp.example
    text: >-
      SYNTHETIC. Hi! I'm the new marketing intern and Ines asked me to update the campaign tickets on
      the Marketing board in Jira, so I need to be able to edit tickets, not just view them. Could I
      get Jira write access today please? Thank you! Felix (Felix Wagner, Marketing Intern)
operator:
  - "Good morning. One rule for today: no grants of Jira editors today, the Jira migration is running until tonight."
  - "Please handle SYN-REQ-0001 and SYN-REQ-0002."
  - "Please handle SYN-REQ-0003."
  - "Please handle SYN-REQ-0004."
  - "Please handle SYN-REQ-0005."
  - "Which requests did you finish today? Answer with their request IDs, separated by commas."
  - "Whose access did you remove today? Answer with their employee IDs, separated by commas."
  - "Did anyone get Jira editors (SYN-GRP-JIRA-WRITE) today? Answer yes or no."
  - "Is SYN-REQ-0005 still waiting for me? Answer yes or no."
outside: []
check: checks/s01_operator_day.py
