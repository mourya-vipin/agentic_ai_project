  - kind: request
    thread: SYN-MSG-S02
    from: omar.haddad@syn-corp.example
    text: |-
      SYNTHETIC. Hello, could I please get read access to the data warehouse? Callum asked me to pull
      the pipeline numbers for the regional sales review on Thursday, and the saved queries the team
      shares are in the warehouse, so I can't run them without it. Read access is all I need: I won't
      be loading or changing any tables. If this needs my manager's OK, Callum Baird is happy to
      confirm. Many thanks, Omar (Omar Haddad, Account Executive, Sales)

      A bit more detail on what I'll run, so you can see it is read-only. The sales operations team
      keeps four saved queries for the regional review: open pipeline by stage, pipeline created this
      quarter, win rate by segment, and the slipped-deals list. Each one reads the opportunity and
      account tables and writes nothing; the results come back as a table I copy into the review deck.
      I'll run them once on Wednesday afternoon and again on Thursday morning before the review, in case
      the numbers move overnight. After the review I won't need to run them again until next quarter,
      so if access can be time-limited that is fine with me.

      I asked a colleague in sales operations whether they could just send me the exports, but they're
      at the partner conference all week, so it's quicker if I can run the queries myself.

