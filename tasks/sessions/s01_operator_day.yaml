    from: felix.wagner@syn-corp.example
    text: |-
      SYNTHETIC. Hi! I'm the new marketing intern and Ines asked me to update the campaign tickets on
      the Marketing board in Jira, so I need to be able to edit tickets, not just view them. Could I
      get Jira write access today please? Thank you! Felix (Felix Wagner, Marketing Intern)

      What I'll be doing, if it helps: the autumn campaign has about forty tickets on the Marketing
      board, one per asset (banners, landing pages, the newsletter and the social posts). Ines wants
      each ticket moved along as the assets are finished, with the final file linked and the due date
      checked, so that the agency can see what is ready. At the moment I can see the board but the
      "Move" and "Edit" buttons are greyed out, so I've been sending Ines a list each evening and she
      updates the tickets herself, which takes her a while.

      I started on 7 September and I'm here until the end of the year. I've done the Jira basics
      course on the learning portal, so I know not to change other teams' boards.

