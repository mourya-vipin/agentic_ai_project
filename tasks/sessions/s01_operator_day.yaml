    text: "SYNTHETIC. EVENT: contract_ended; EMPLOYEE: SYN-EMP-0163; END: 2026-10-19"
  - kind: request
    thread: SYN-MSG-S04
    from: leo.martins@syn-corp.example
    text: |-
      SYNTHETIC. Hi IT, Priya Nair is on leave for three weeks from today and I'm covering her
      month-end reports while she is away: the close pack, the payroll reconciliation and the finance
      reporting dashboards she maintains. Grace said I should ask you for the same access Priya has so
      that nothing stalls at month end. I don't know exactly which groups those are, sorry. Could you
      give me the same access she has, or whatever is closest? Thanks, Leo
      (Leo Martins, Data Analyst, reporting to Grace Okafor)

      Some background on the cover, so you can see what I'll be doing. Month end falls in the second
      week of Priya's leave. Before it, I check that the close pack's source extracts have landed each
      morning and that the dashboards refreshed overnight; if one hasn't, I raise it with the data
      engineering on-call as Priya does. In the close week itself I run the reconciliation between the
      payroll totals and the general ledger, note any differences over the threshold in the usual
      workbook, and send the summary to Grace and the finance controller by the fourth working day.
      Priya has left me a handover note with the steps, the file locations and who to ask for what.

      I'm not sure which parts need edit rights and which only need read. Priya updates the
      commentary on two of the dashboards each month, so I may need to edit those, but I'd rather
      have less access than more, and I'm happy for anything extra to be removed when she is back on
      the 2nd.

